services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ${DEPBRIDGE_ENV_FILE:-/etc/depbridge/service.env}
    environment:
      DEPBRIDGE_DATA_DIR: /data
      DEPBRIDGE_FRONTEND_DIR: /app/frontend
    volumes:
      - depbridge_data:/data
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DEPBRIDGE_SITE_ADDRESS: ${DEPBRIDGE_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  depbridge_data:
  caddy_data:
  caddy_config:
